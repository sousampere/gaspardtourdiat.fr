# NOTE ON DNS
# On restricted networks (school/corporate) the LAN's DNS server is often
# unreachable from inside Docker's bridge network, which makes `npm install`
# during the build and GitHub API calls at runtime fail with "bad address".
# Both are solved below: `build.network: host` lets the build use the host's
# resolver, and `dns:` gives the running containers a public fallback.
# On a normal server these settings are harmless.
x-dns: &dns
  - ${DNS_PRIMARY:-1.1.1.1}
  - ${DNS_SECONDARY:-8.8.8.8}

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    dns: *dns
    environment:
      MARIADB_DATABASE: ${DB_NAME:-gaspardtourdiat}
      MARIADB_USER: ${DB_USER:-gtd}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - internal

  api:
    build:
      context: ./backend
      network: host
    restart: unless-stopped
    dns: *dns
    env_file:
      - .env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal

  web:
    build:
      context: ./frontend
      network: host
    restart: unless-stopped
    dns: *dns
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_started
    networks:
      - internal

volumes:
  db_data:

networks:
  internal:
    driver: bridge
