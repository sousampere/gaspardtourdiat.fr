# This file is included from nginx's `http` context (/etc/nginx/conf.d/*.conf),
# so `upstream` belongs at the top level here — putting it inside `server`
# makes nginx refuse to start with "upstream directive is not allowed here".

upstream api_upstream {
    server api:3000;
    keepalive 16;
}

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 512;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types      text/plain text/css text/javascript application/javascript
                    application/json application/xml image/svg+xml font/woff2;

    # Scanners constantly probe for these. Answering immediately keeps the
    # noise out of the API logs.
    location ~* /(\.git|\.env|wp-admin|wp-login|phpmyadmin|\.aws|\.ssh) {
        return 404;
    }

    location /api/ {
        proxy_pass         http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        # Streaming the API response means the admin panel sees errors as they
        # happen rather than after a buffer flush.
        proxy_buffering    off;
    }

    # Vite fingerprints every file under /assets with a content hash, so these
    # can be cached forever.
    #
    # NOTE: `add_header` is not inherited by a location that declares its own,
    # which is why the security headers are repeated in the locations below.
    location /assets/ {
        expires    1y;
        access_log off;
        try_files  $uri =404;

        add_header Cache-Control        "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The entry point must never be cached, or a deploy would keep serving the
    # old asset hashes.
    location = /index.html {
        add_header Cache-Control        "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options      "SAMEORIGIN" always;
        add_header Referrer-Policy      "strict-origin-when-cross-origin" always;
    }

    location = /favicon.svg {
        expires    7d;
        access_log off;
    }

    # Client-side routing: unknown paths belong to the SPA, not to a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}
